<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){if(localStorage.getItem("ahViewDesktop")==="1"){var m=document.querySelector('meta[name="viewport"]');if(m)m.setAttribute("content","width=1280")}})();</script>
<title>買方配案｜填你的條件，我從手上的委託幫你挑</title>
<meta name="description" content="填區域、總價、坪數、房數、屋齡、車位這些你在 591 會篩的條件，阿宏從手上正在銷售的委託逐一比對評分，配不到就說配不到，不硬推。需求單可一鍵複製傳 LINE。">
<meta property="og:title" content="買方配案｜填你的條件，我從手上的委託幫你挑">
<meta property="og:description" content="591 只能篩總價坪數地區。這裡多問你幾句「為什麼要買」，挑出來的才是真的適合你。">
<link rel="canonical" href="https://0930848000.com/maifang/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
.form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.fg{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:700px){.fg{grid-template-columns:1fr 1fr}}
.fl{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px}
.fl small{font-weight:400;color:var(--fade);margin-left:6px}
.inp,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:15px;color:var(--ink)}
.inp:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brandsoft)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.row-btn{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px}
.res{margin-top:24px}
.hit{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px}
.hit.top{border-color:var(--gold);border-width:2px}
.hit-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hit-h b{font-size:16.5px;font-weight:900}
.hit-h .pr{font-size:18px;font-weight:900;color:var(--gold-dk);font-variant-numeric:tabular-nums}
.hit-h .sc{margin-left:auto;font-size:12px;font-weight:700;color:var(--brand);background:var(--brandsoft);padding:3px 10px;border-radius:99px}
.hit p{margin:6px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.7}
.hit .bad{color:#9C4A2F}
.hit a{display:inline-block;margin-top:9px;font-size:13.5px;font-weight:700;color:var(--brand)}
.sheet{background:var(--night);color:#fff;border-radius:12px;padding:18px 20px;margin-top:20px}
.sheet h3{margin:0 0 10px;font-size:16px;font-weight:900;color:var(--gold)}
.sheet pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13.5px;line-height:1.85;color:rgba(255,255,255,.9);margin:0 0 14px}
.err{color:#9C4A2F;font-size:13.5px;margin-top:8px}
.ok{background:var(--brand)!important;color:#fff!important}
</style>
</head>
<body>
<div id="ahnav"></div>

<section class="pagehd"><div class="wrap">
  <p class="eyebrow">BUYER MATCH</p>
  <h1>填你的條件<br>我從手上的委託幫你挑</h1>
  <p>591 只能篩總價、坪數、地區。這裡多問你幾句「為什麼要買」，挑出來的才是真的適合你的。配不到我就說配不到，不硬推。</p>
</div></section>

<section><div class="wrap">
  <div class="form">
    <div class="fg">
      <div>
        <label class="fl" for="q_region">想找哪一區 <small>可複選</small></label>
        <div class="chips" id="q_region"></div>
      </div>
      <div>
        <label class="fl" for="q_budget">總價上限 <small>萬元</small></label>
        <input class="inp" id="q_budget" type="number" inputmode="numeric" placeholder="例如 1200">
        <label class="fl" style="margin-top:12px" for="q_room">需要幾房</label>
        <div class="chips" id="q_room"></div>
      </div>
      <div>
        <label class="fl" for="q_ping">坪數下限 <small>權狀坪，可留空</small></label>
        <input class="inp" id="q_ping" type="number" inputmode="numeric" placeholder="例如 25">
      </div>
      <div>
        <label class="fl">一定要有的條件 <small>可複選</small></label>
        <div class="chips" id="q_must"></div>
      </div>
      <div style="grid-column:1/-1">
        <label class="fl" for="q_why">為什麼要買 <small>這題最重要，決定我怎麼幫你挑</small></label>
        <textarea class="inp" id="q_why" rows="3" placeholder="例如：小孩明年要上小學想換學區、現在租金太高想買、家裡長輩要同住需要多一房、想買來收租"></textarea>
      </div>
      <div>
        <label class="fl" for="q_when">什麼時候要</label>
        <select id="q_when">
          <option value="">看到適合的再說</option>
          <option>三個月內</option>
          <option>半年內</option>
          <option>一年內</option>
          <option>急，越快越好</option>
        </select>
      </div>
      <div>
        <label class="fl" for="q_contact">你的稱呼與聯絡方式 <small>不填也可以先看配對結果</small></label>
        <input class="inp" id="q_contact" placeholder="例如：陳先生 0912-xxx-xxx 或 LINE ID">
      </div>
    </div>
    <div class="row-btn">
      <button class="btn btn-brand" id="go">開始配案</button>
      <button class="btn btn-ghost" id="clr" style="border-color:var(--line);color:var(--ink2)">清空重填</button>
    </div>
    <div class="err" id="err" hidden></div>
  </div>

  <div class="res" id="res"></div>

  <div class="note" style="margin-top:26px">
    <b>這頁怎麼運作：</b>比對的是阿宏手上正在銷售的委託案，不是 591 全市場。所有比對都在你的手機裡算完，這頁不會儲存、不會上傳你填的任何內容——關掉分頁就沒了。要傳給我，你自己按複製再貼到 LINE。<br>
    分數只是排序參考，不是保證交易條件。價格、屋況、坪數一律以謄本與現場為準，開價≠成交價。
  </div>
</div></section>

<div id="ahfoot"></div>
<script src="/site.config.js?v=20260820e"></script>
<script src="/tikuan.js?v=20260820e"></script>
<script src="/nav.js?v=20260820e"></script>
<script src="/wujian/data.js"></script>
<script>
(function(){
  var L=window.AHLISTINGS||[];
  var LINE='https://lin.ee/IV8bl9H';
  var REGIONS=[];
  L.forEach(function(x){ if(REGIONS.indexOf(x.r)<0) REGIONS.push(x.r) });
  var ROOMS=['1-2房','3房','4房以上','不限'];
  var MUST=['電梯','車位','近捷運','學區','空屋免整理','已裝潢'];

  function chips(box,arr,multi){
    var el=document.getElementById(box);
    el.innerHTML=arr.map(function(t){return '<button type="button" class="chip" aria-pressed="false" data-v="'+t+'">'+t+'</button>'}).join('');
    el.addEventListener('click',function(e){
      var b=e.target.closest('.chip'); if(!b) return;
      var on=b.getAttribute('aria-pressed')==='true';
      if(!multi) el.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed','false')});
      b.setAttribute('aria-pressed',on?'false':'true');
    });
  }
  function picked(box){
    return [].slice.call(document.querySelectorAll('#'+box+' .chip[aria-pressed="true"]')).map(function(b){return b.dataset.v});
  }
  chips('q_region',REGIONS,true); chips('q_room',ROOMS,false); chips('q_must',MUST,true);

  function num(s){var m=String(s).match(/[\d.]+/);return m?parseFloat(m[0]):0}
  function nf(x){return String(x).replace(/\B(?=(\d{3})+(?!\d))/g,',')}

  function roomOf(x){
    var s=x.sp.join(' ');
    var m=s.match(/(\d)\s*房/);
    if(m) return parseInt(m[1],10);
    if(/全開放|零隔間/.test(s+x.sell)) return 0;
    return null;
  }
  function pingOf(x){
    for(var i=0;i<x.sp.length;i++){ if(/坪/.test(x.sp[i])) return num(x.sp[i]) }
    return 0;
  }
  function hasFeature(x,f){
    var s=(x.sp.join(' ')+' '+x.sell+' '+x.honest).toLowerCase();
    if(f==='電梯') return /電梯/.test(s)&&!/無電梯/.test(s);
    if(f==='車位') return /車位/.test(s)&&!/無車位|本戶無附車位/.test(s);
    if(f==='近捷運') return /捷運|車站|lg1\d/.test(s);
    if(f==='學區') return /學區|國小|國中|高中/.test(s);
    if(f==='空屋免整理') return /空屋/.test(s);
    if(f==='已裝潢') return /裝潢|更新|家電/.test(s);
    return false;
  }

  document.getElementById('clr').addEventListener('click',function(){
    document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed','false')});
    ['q_budget','q_ping','q_why','q_contact'].forEach(function(id){document.getElementById(id).value=''});
    document.getElementById('q_when').value='';
    document.getElementById('res').innerHTML='';
    document.getElementById('err').hidden=true;
  });

  document.getElementById('go').addEventListener('click',function(){
    var err=document.getElementById('err');
    var regions=picked('q_region'), rooms=picked('q_room')[0]||'', musts=picked('q_must');
    var budget=parseFloat(document.getElementById('q_budget').value)||0;
    var ping=parseFloat(document.getElementById('q_ping').value)||0;
    var why=document.getElementById('q_why').value.trim();
    var when=document.getElementById('q_when').value;
    var contact=document.getElementById('q_contact').value.trim();

    if(!regions.length && !budget && !rooms && !musts.length && !ping){
      err.textContent='至少填一項條件再按開始配案——區域、總價、房數任選一個都可以。';
      err.hidden=false; return;
    }
    err.hidden=true;

    var scored=L.map(function(x){
      var s=0, notes=[], fail=[];
      if(regions.length){ if(regions.indexOf(x.r)>=0){s+=30;notes.push('在你要的'+x.r)} else {fail.push('不在你選的區域（本案在'+x.r+'）')} }
      if(budget){ if(x.p<=budget){s+=30;notes.push('總價 '+nf(x.p)+' 萬在預算內')} else if(x.p<=budget*1.1){s+=12;notes.push('總價超出約 '+Math.round((x.p/budget-1)*100)+'%，議價後有機會')} else {fail.push('總價 '+nf(x.p)+' 萬超過預算較多')} }
      var r=roomOf(x);
      if(rooms&&rooms!=='不限'&&r!==null){
        var ok = (rooms==='1-2房'&&r<=2)||(rooms==='3房'&&r===3)||(rooms==='4房以上'&&r>=4);
        if(ok){s+=25;notes.push('房數符合')} else if(r===0){s+=8;notes.push('全開放格局，要幾房可自己隔')} else {fail.push('格局是 '+r+' 房')}
      }
      if(ping){ var p=pingOf(x); if(p>=ping){s+=10;notes.push('權狀 '+p+' 坪')} else if(p) {fail.push('坪數 '+p+' 坪小於你要的 '+ping+' 坪')} }
      musts.forEach(function(f){ if(hasFeature(x,f)){s+=8;notes.push(f)} else {fail.push('沒有「'+f+'」')} });
      return {x:x,s:s,notes:notes,fail:fail};
    }).sort(function(a,b){return b.s-a.s});

    var hits=scored.filter(function(o){return o.s>=30}).slice(0,4);
    var box=document.getElementById('res');
    var h='';

    if(!hits.length){
      h+='<div class="hit"><div class="hit-h"><b>手上目前沒有對得上的</b></div>'+
         '<p>與其硬推一間不合的給你，不如直接說沒有。把需求單傳給我，新委託進來我第一時間比對，或是我去談談看有沒有降價空間。</p></div>';
    }else{
      h+='<h2 class="sec" style="margin-bottom:14px">配到 '+hits.length+' 間（共 '+L.length+' 間在售）</h2>';
      hits.forEach(function(o,i){
        h+='<div class="hit'+(i===0?' top':'')+'"><div class="hit-h">'+
           '<b>'+o.x.n+'</b><span class="pr">'+nf(o.x.p)+' 萬</span>'+
           '<span class="sc">'+(i===0?'最接近':'符合度 '+o.s)+'</span></div>'+
           '<p>'+o.x.loc+'　'+o.x.sp.join('　')+'</p>'+
           (o.notes.length?'<p>✔ '+o.notes.join('、')+'</p>':'')+
           (o.fail.length?'<p class="bad">⚠ '+o.fail.join('；')+'</p>':'')+
           '<p class="bad">缺點先講：'+o.x.honest+'</p>'+
           '<a href="/wujian/#'+o.x.id+'">看這間完整資料 →</a></div>';
      });
    }

    var sheet='【買房需求單】\n'+
      (contact?'稱呼聯絡：'+contact+'\n':'')+
      '想找區域：'+(regions.join('、')||'未指定')+'\n'+
      '總價上限：'+(budget?budget+' 萬':'未指定')+'\n'+
      '需要房數：'+(rooms||'未指定')+'\n'+
      (ping?'坪數下限：'+ping+' 坪\n':'')+
      '一定要有：'+(musts.join('、')||'無特別要求')+'\n'+
      (when?'時間規劃：'+when+'\n':'')+
      (why?'為什麼要買：'+why+'\n':'')+
      (hits.length?'\n網站配到：'+hits.map(function(o){return o.x.n}).join('、'):'\n網站目前配不到，請幫我留意新案');

    h+='<div class="sheet"><h3>把這張需求單傳給阿宏</h3><pre id="sheet">'+
       sheet.replace(/</g,'&lt;')+'</pre>'+
       '<button class="btn btn-gold" id="cp">複製需求單</button> '+
       '<a class="btn btn-line" href="'+LINE+'" style="margin-left:8px">開啟 LINE 貼上</a></div>';

    box.innerHTML=h;
    box.scrollIntoView({behavior:'smooth',block:'start'});

    var cp=document.getElementById('cp');
    if(cp) cp.addEventListener('click',function(){
      var t=sheet, done=function(){cp.textContent='已複製，去 LINE 貼上';cp.classList.add('ok');setTimeout(function(){cp.textContent='複製需求單';cp.classList.remove('ok')},2200)};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fb(t,done)})}else fb(t,done);
    });
  });

  function fb(t,done){
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');done()}catch(e){window.prompt('長按複製需求單：',t)}
    document.body.removeChild(ta);
  }
})();
</script>
</body>
</html>
