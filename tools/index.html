/* 逐月攤還模擬：支援寬限期＋利率變動（機動利率／升息壓力測試） */
function amortize(P, years, r1, r2, switchYear, graceYears){
  var n=Math.round(years*12), g=Math.round(graceYears*12), sw=Math.round(switchYear*12);
  var bal=P, totInt=0, rows=[], firstPay=0, afterGrace=0, afterSwitch=0;
  if(n<=0||P<=0) return {rows:[],totInt:0,firstPay:0,afterGrace:0,afterSwitch:0,n:0,total:0};
  for(var m=1;m<=n;m++){
    var ar = (m<=sw? r1 : r2);
    var i = ar/100/12;
    var interest = bal*i, pay, pp;
    if(m<=g){ pay=interest; pp=0 }
    else{
      var remain=n-m+1;
      pay = i>0 ? bal*i/(1-Math.pow(1+i,-remain)) : bal/remain;
      pp = pay-interest;
    }
    bal-=pp; totInt+=interest;
    if(m===1) firstPay=pay;
    if(m===g+1) afterGrace=pay;
    if(m===sw+1) afterSwitch=pay;
    rows.push({m:m,pay:pay,int:interest,pp:pp,bal:Math.max(bal,0),rate:ar});
  }
  return {rows:rows,totInt:totInt,firstPay:firstPay,afterGrace:afterGrace||firstPay,
          afterSwitch:afterSwitch,n:n,total:P+totInt};
}

      var byIncome = P/ltv;                                // 收入撐得起的總價
      var byCash   = cash/(1-ltv+feeRate);                 // 現金撐得起的總價
      var total = Math.min(byIncome, byCash);
      return {cap:cap,P:P,byIncome:byIncome,byCash:byCash,total:total,
              bind: byIncome<byCash ? '收入' : '自備款'};
    }
    var pick=calc(parseFloat(segv('a_seg')));
    if(!pick){ $('a_out').innerHTML='<div class="verdict r"><div class="lv">算不出來</div><p>現有月付負債已經吃掉全部可負擔額度。先處理既有負債，再談買房。</p></div>'; return }

    out+='<div class="hero-num accent"><div class="lab">可負擔總價上限</div>'+
      '<div class="val">'+wan(pick.total,0)+' <small>萬</small></div>'+
      '<div class="note">卡在<b>'+pick.bind+'</b>這一邊 ‧ 月付上限 '+nf(pick.cap)+' 元</div></div>';

    out+='<div class="kv">'+
      kvRow('收入撐得起的總價','月付 '+nf(pick.cap)+' 元 → 可貸 '+wan(pick.P,0)+' 萬', wan(pick.byIncome,0)+' 萬')+
      kvRow('自備款撐得起的總價','現金 '+wan(cash,0)+' 萬 ÷（頭款 '+nf((1-ltv)*100)+'% ＋ 稅費裝潢 '+v('a_fee')+'%）', wan(pick.byCash,0)+' 萬')+
      kvRow('可以看的總價帶','建議往下抓 5–10% 留議價空間', wan(pick.total*0.9,0)+' ～ '+wan(pick.total,0)+' 萬','tot')+
      '</div>';

    var rows=[[PAR('dbrSafe',33),'保守'],['40','標準'],[PAR('dbrMax',45),'極限']], t='';
    t+='<div class="box" style="margin-top:12px"><h4>三條線一起看</h4><div class="kv">';
    for(var i=0;i<rows.length;i++){
      var c=calc(parseFloat(rows[i][0]));
      if(c) t+=kvRow(rows[i][0]+'% '+rows[i][1],'月付 '+nf(c.cap)+' 元', wan(c.total,0)+' 萬');
    }
    t+='</div><p class="hint">三條線差距很大，代表你的購屋能力其實是「你願意過多緊的日子」決定的，不是房價決定的。</p></div>';
    $('a_out').innerHTML=out+t;
  },
  after:function(){}
 }}
},

      else {rate=15;rateT='逾10年　15%'}

      kvRow('仲介服務費','× '+v('s_fee')+'%', '− '+nf(fee)+' 元','neg')+

      kvRow('實際入袋','匯進戶頭的數字', nf(net)+' 元　('+wan(net,0)+' 萬)','tot')+

      h+='<div class="box" style="margin-top:12px"><h4>房地合一稅怎麼算出來的</h4><div class="kv">'+

        kvRow('減：土地漲價總數額','已課土增稅部分不重複課', '− '+nf(lgain)+' 元','neg')+
        kvRow('＝ 課稅所得','', nf(taxable)+' 元','tot')+
        (isSelf? kvRow('自住免稅額','','− 4,000,000 元','neg')+kvRow('應納稅額','超過 400 萬部分 × 10%', nf(tax)+' 元','tot')
               : kvRow('應納稅額','× '+rate+'%', nf(tax)+' 元','tot'))+
        '</div></div>';
    }

    var wait=hold<2?2-hold:(hold<5?5-hold:(hold<10?10-hold:0));
    if(!isOld && !isSelf && wait>0){
      var nextRate = hold<2?35:(hold<5?20:15);
      var save = taxable*(rate-nextRate)/100;
      h+='<div class="verdict y" style="margin-top:12px"><div class="lv">對立視角：現在賣 vs 再等 '+nf(wait,1)+' 年</div>'+
        '<p>再持有 '+nf(wait,1)+' 年，稅率由 '+rate+'％ 降到 '+nextRate+'％，同樣售價可少繳 <b>'+wan(save,0)+' 萬</b>。'+
        '但這 '+nf(wait,1)+' 年要承擔房價變動、利息支出、機會成本與屋況折舊——<b>不是等就一定賺</b>。'+
        '把「少繳的稅」跟「這段期間的貸款利息＋房價風險」放一起比，才是完整的決策。</p></div>';
    }

    $('s_out').innerHTML=h;

    window.__sellSummary='【賣方實拿試算】\n成交總價　'+nf(price/10000)+' 萬\n'+
      '仲介服務費（'+v('s_fee')+'%）　−'+wan(fee,1)+' 萬\n'+
      '代書履保雜費　−'+nf(scr)+' 元\n'+
      '土地增值稅　−'+wan(lvt,1)+' 萬\n'+
      '房地合一稅（'+rateT+'）　−'+wan(tax,1)+' 萬\n'+
      '清償剩餘貸款　−'+wan(loan,0)+' 萬\n───────────\n實際入袋　'+wan(net,0)+' 萬\n\n'+
      '※ 稅額為決策輔助試算，實際以國稅局核定為準';

   '<div><label class="fl">屋主開價／待議價格 <i>用來定位</i></label><div class="unit"><input class="inp" id="v_ask" value="1880"><span class="u">萬</span></div></div>'+
   '<div><label class="fl">個案條件調整</label>'+
    seg('v_seg',[['-6','劣勢 −6%'],['0','持平'],['6','優勢 +6%']],'0')+
    '<p class="hint" style="margin-top:6px">劣勢：一樓／頂樓無電梯／面路噪音／格局差／屋況待整。優勢：邊間採光／低樓層免爬／整層／剛翻新／稀有格局。</p></div>'+
   '</div>',
  out:'<div id="v_out"></div>'+
      '<div class="row-btn" style="margin-top:12px"><button class="btn sm ghost" id="v_copy">複製估價摘要</button></div>'+
      '<div class="disc">單價請以實價登錄同社區近一年成交為主、同路段為輔。實價登錄有申報時滯（成交後 30 日內申報、每旬揭露、常有補登），近三個月資料不完整，引用時要註明「實價登錄揭露至 ○年○月」。本工具只做價格帶定位，不構成任何價格保證。</div>',
  run:function(){
    var all=v('v_all'), pk=v('v_pk'), pkp=v('v_pkp')*10000;
    var up=v('v_up')*10000, adj=parseFloat(segv('v_seg'))/100;
    var bldg=Math.max(all-pk,0);
    var base=up*(1+adj);
    var dn=base*(1-v('v_dn')/100), opt=base*(1+v('v_up2')/100);
    var lo=dn*bldg, mid=base*bldg, hi=opt*bldg;
    var loT=lo+pkp, midT=mid+pkp, hiT=hi+pkp;
    var ask=v('v_ask')*10000;

    var h='<div class="hero-num accent"><div class="lab">合理總價（含車位）</div>'+
      '<div class="val">'+wan(midT,0)+' <small>萬</small></div>'+
      '<div class="note">建物 '+nf(bldg,2)+' 坪 × '+nf(base/10000,2)+' 萬/坪　＋　車位 '+nf(pkp/10000,0)+' 萬</div></div>';

    // 價格帶
    var span=hiT-loT, pos = span>0 ? (ask-loT)/span : 0.5;
    var clamp=Math.max(-0.12,Math.min(1.12,pos));
    h+='<div class="box"><h4>價格帶定位</h4><div class="band">'+
      '<div class="band-track"><div class="band-fill" style="left:0;right:0"></div>'+
      '<div class="band-mark mid" style="left:50%"></div>'+
      '<div class="band-mark" style="left:'+(clamp*100).toFixed(1)+'%;background:var(--ind);width:3px"></div>'+
      '</div><div class="band-labs">'+
      '<div><div class="t">保守</div><div class="v">'+wan(loT,0)+'</div></div>'+
      '<div class="mid"><div class="t">合理</div><div class="v">'+wan(midT,0)+'</div></div>'+
      '<div><div class="t">樂觀</div><div class="v">'+wan(hiT,0)+'</div></div>'+
      '</div><p class="hint">紫線＝屋主開價 '+nf(ask/10000,0)+' 萬</p></div></div>';

    var diff=(ask-midT)/midT*100;
    var lvl = diff>12?'r':(diff>4?'y':(diff<-8?'g':'g'));
    var txt = diff>12 ? '開價高於合理價 '+nf(diff,1)+'％，已超出樂觀帶。這種案子不先修正價格就上架，只會累積帶看無斡旋的紀錄，最後變滯銷案。'
            : diff>4 ? '開價高於合理價 '+nf(diff,1)+'％，落在合理到樂觀之間。有議價空間，但要先跟屋主說清楚：這個價格會過濾掉大部分自住買方。'
            : diff<-8 ? '開價低於合理價 '+nf(Math.abs(diff),1)+'％。先確認為什麼——急售？屋況有問題？產權有瑕疵？<b>先查清楚再推</b>，便宜通常有原因。'
            : '開價落在合理帶內（差 '+nf(diff,1)+'％），價格可推。接下來卡的是素材跟通路，不是價格。';
    h+='<div class="verdict '+lvl+'" style="margin-top:12px"><div class="lv">定價判讀</div><p>'+txt+'</p></div>';

    h+='<div class="box" style="margin-top:12px"><h4>拆開來看</h4><div class="kv">'+
      kvRow('權狀總坪','', nf(all,2)+' 坪')+
      kvRow('車位登記坪','從總坪拆出，不參與單價計算', nf(pk,2)+' 坪')+
      kvRow('建物計價坪','實際乘單價的坪數', nf(bldg,2)+' 坪')+
      kvRow('採用單價','已含個案調整 '+(adj>=0?'+':'')+nf(adj*100,0)+'%', nf(base/10000,2)+' 萬/坪')+
      kvRow('保守 ／ 合理 ／ 樂觀（不含車位）','', wan(lo,0)+' ／ '+wan(mid,0)+' ／ '+wan(hi,0)+' 萬')+
      kvRow('保守 ／ 合理 ／ 樂觀（含車位）','', wan(loT,0)+' ／ '+wan(midT,0)+' ／ '+wan(hiT,0)+' 萬','tot')+
      kvRow('屋主開價換算單價','（開價 − 車位）÷ 建物坪', bldg>0?nf((ask-pkp)/bldg/10000,2)+' 萬/坪':'—')+
      '</div></div>';
    $('v_out').innerHTML=h;

    window.__valSummary='【三價估價】\n權狀 '+nf(all,2)+' 坪（車位 '+nf(pk,2)+' 坪，建物計價 '+nf(bldg,2)+' 坪）\n'+
      '採用單價　'+nf(base/10000,2)+' 萬/坪　車位　'+nf(pkp/10000,0)+' 萬\n───────────\n'+
      '保守　'+wan(loT,0)+' 萬\n合理　'+wan(midT,0)+' 萬\n樂觀　'+wan(hiT,0)+' 萬\n'+
      '（以上含車位）\n\n屋主開價 '+nf(ask/10000,0)+' 萬，'+(diff>=0?'高於':'低於')+'合理價 '+nf(Math.abs(diff),1)+'%\n'+
      '\n※ 單價來源：實價登錄同社區／同路段，揭露至　　年　　月';
  },
  after:function(){ $('v_copy').onclick=function(){ copy(window.__valSummary||'','估價摘要已複製') } }
 }}
},

{
 id:'yield', g:'calc', name:'租金投報率 ＋ 合理買價回推', pill:['p-ind','投資客'],
 desc:'毛投報只是廣告數字。扣掉管理費、稅、修繕、空置，淨投報才是真的。並回推該用多少錢買。',
 tail:'包租代管話術的照妖鏡',
 sub:'給定目標報酬率，回推這間房最多值多少錢',
 build:function(){ return {
  form:
   '<div class="f">'+
   '<div><label class="fl">購入總價</label><div class="unit"><input class="inp" id="y_price" value="880"><span class="u">萬</span></div></div>'+
   '<div class="f2">'+
    '<div><label class="fl">月租金</label><div class="unit"><input class="inp" id="y_rent" value="22000"><span class="u">元</span></div></div>'+
    '<div><label class="fl">裝潢／家電投入</label><div class="unit"><input class="inp" id="y_deco" value="60"><span class="u">萬</span></div></div>'+
   '</div>'+
   '<div class="f2">'+
    '<div><label class="fl">管理費</label><div class="unit"><input class="inp" id="y_mgm" value="2400"><span class="u">元/月</span></div></div>'+
    '<div><label class="fl">空置率 <i>一年空幾個月</i></label><div class="unit"><input class="inp" id="y_vac" value="1"><span class="u">月</span></div></div>'+
   '</div>'+
   '<div class="f2">'+
    '<div><label class="fl">房屋稅＋地價稅</label><div class="unit"><input class="inp" id="y_tax" value="12000"><span class="u">元/年</span></div></div>'+
    '<div><label class="fl">修繕維護提列</label><div class="unit"><input class="inp" id="y_fix" value="15000"><span class="u">元/年</span></div></div>'+
   '</div>'+
   '<div class="f2">'+
    '<div><label class="fl">貸款成數</label><div class="unit"><input class="inp" id="y_ltv" value="60"><span class="u">%</span></div></div>'+
    '<div><label class="fl">房貸年利率</label><div class="unit"><input class="inp" id="y_r" value="2.8"><span class="u">%</span></div></div>'+
   '</div>'+
   '<div><label class="fl">你要求的最低淨投報</label><div class="unit"><input class="inp" id="y_goal" value="'+PAR('yieldGoal',3)+'"><span class="u">%</span></div></div>'+
   '</div>',
  out:'<div id="y_out"></div>'+
      '<div class="disc">租賃所得須併入個人綜合所得稅（可減除必要損耗費用），非自住房屋稅與地價稅稅率較高，本表未含所得稅影響。房東須留意租賃住宅市場發展及管理條例、包租代管相關規範。</div>',
  run:function(){
    var price=v('y_price')*10000, rent=v('y_rent'), deco=v('y_deco')*10000;
    var mgm=v('y_mgm')*12, vac=v('y_vac'), tax=v('y_tax'), fix=v('y_fix');
    var ltv=v('y_ltv')/100, r=v('y_r')/100;
    var gross=rent*12;
    var effective=rent*(12-vac);
    var netIncome=effective-mgm-tax-fix;
    var capital=price+deco;
    var grossY=gross/price*100;
    var netY=netIncome/capital*100;
    var loan=price*ltv, interest=loan*r;
    var cashIn=capital-loan;
    var cashFlow=netIncome-interest;
    var coc= cashIn>0 ? cashFlow/cashIn*100 : 0;
    var fair=v('y_goal')>0 ? netIncome/(v('y_goal')/100)-deco : 0;
    var payback= netIncome>0 ? capital/netIncome : 0;

    var lvl = netY>=PAR('yieldOk',3)?'g':(netY>=PAR('yieldWarn',2)?'y':'r');
    var h='<div class="hero-num '+(lvl==='g'?'good':lvl==='y'?'accent':'bad')+'">'+
      '<div class="lab">淨投報率（扣管理費、稅、修繕、空置）</div>'+
      '<div class="val">'+nf(netY,2)+' <small>％</small></div>'+
      '<div class="note">毛投報 '+nf(grossY,2)+'％ ‧ 中間差了 '+nf(grossY-netY,2)+' 個百分點</div></div>';

    h+='<div class="kv">'+
      kvRow('年租金收入（滿租）','月租 '+nf(rent)+' × 12', nf(gross)+' 元')+
      kvRow('扣空置','一年空 '+vac+' 個月', '− '+nf(rent*vac)+' 元','neg')+
      kvRow('扣管理費','', '− '+nf(mgm)+' 元','neg')+
      kvRow('扣房屋稅地價稅','', '− '+nf(tax)+' 元','neg')+
      kvRow('扣修繕提列','', '− '+nf(fix)+' 元','neg')+
      kvRow('年淨租金收入','', nf(netIncome)+' 元','tot')+
      '</div>';

    h+='<div class="box" style="margin-top:12px"><h4>用了貸款之後</h4><div class="kv">'+
      kvRow('貸款金額','成數 '+v('y_ltv')+'%', nf(loan)+' 元')+
      kvRow('年利息支出','僅計息，未含本金攤還', '− '+nf(interest)+' 元','neg')+
      kvRow('年現金流','淨租金 − 利息', nf(cashFlow)+' 元'+(cashFlow<0?'（負現金流）':''), cashFlow<0?'neg':'')+
      kvRow('自有資金投入','總價＋裝潢 − 貸款', nf(cashIn)+' 元')+
      kvRow('自有資金報酬率','年現金流 ÷ 自有資金', nf(coc,2)+' ％','tot')+
      '</div></div>';

    h+='<div class="box" style="margin-top:12px"><h4>回推：這間最多值多少</h4><div class="kv">'+
      kvRow('要達到 '+v('y_goal')+'% 淨投報','最高可付總價（已扣裝潢）', wan(fair,0)+' 萬','tot')+
      kvRow('目前開價與合理買價差','', wan(price-fair,0)+' 萬'+(price>fair?'（買貴了）':'（還有空間）'), price>fair?'neg':'')+
      kvRow('回本年數','不計房價漲跌、不計利息', nf(payback,1)+' 年')+
      '</div></div>';

    h+='<div class="verdict '+lvl+'" style="margin-top:12px"><div class="lv">'+
      (lvl==='g'?'還算合理':lvl==='y'?'邊際案件':'數字不成立')+'</div><p>'+
      (lvl==='g'?'淨投報 '+nf(netY,2)+'％，在雙北算是可以看的案子。但要記得：投報率是「現在」的租金除以「現在」的房價，房客走了、租金掉了、大樓要拉皮，這個數字就變了。'
       :lvl==='y'?'淨投報 '+nf(netY,2)+'％，跟定存與債券比起來優勢不大，卻要承擔房客風險、空置風險、修繕風險與流動性風險。除非你賭的是增值，不然這筆帳不好看。'
       :'淨投報 '+nf(netY,2)+'％。這個數字撐不起持有成本。若對方用「毛投報 '+nf(grossY,2)+'％」來說服你，那是把管理費、稅、修繕、空置全部藏起來的數字。')+
      '</p>'+(cashFlow<0?'<ul><li>目前是<b>負現金流</b>：每年要自己貼 '+nf(Math.abs(cashFlow))+' 元進去養這間房</li><li>負現金流只有在確定增值時才成立，而增值不是你能控制的</li></ul>':'')+
      '</div>';
    $('y_out').innerHTML=h;
  },
  after:function(){}
 }}
},

{
 id:'ping', g:'calc', name:'坪數換算 ＋ 公設比反推', pill:['p-pub','天天用'],
 desc:'坪、平方公尺互換。權狀拆主建物、附屬、公設、車位，反推真正住得到的坪數。',
 tail:'公設比 35% 代表你花錢買的三分之一走不進去',
 sub:'把權狀坪數拆成「住得到的」跟「買到但用不到的」',
 build:function(){ return {
  form:
   '<div class="box" style="margin-bottom:14px;padding:14px"><h4>單位互換</h4><div class="f2">'+
    '<div><label class="fl">坪</label><input class="inp" id="u_p" value="30"></div>'+
    '<div><label class="fl">平方公尺</label><input class="inp" id="u_m" value="99.17"></div>'+
   '</div><p class="hint">1 坪 ＝ 3.305785 平方公尺　‧　1 平方公尺 ＝ 0.3025 坪</p></div>'+
   '<div class="f">'+
   '<div><label class="fl">權狀總坪數</label><div class="unit"><input class="inp" id="p_all" value="42.5"><span class="u">坪</span></div></div>'+
   '<div class="f2">'+

    '<div><label class="fl">公共設施坪</label><div class="unit"><input class="inp" id="p_pub" value="10.4"><span class="u">坪</span></div></div>'+
   '</div>'+
   '<div><label class="fl">附屬建物坪 <i>陽台等</i></label><div class="unit"><input class="inp" id="p_ext" value="2.8"><span class="u">坪</span></div></div>'+

    '<div><label class="fl">總價 <i>用來算真實單價</i></label><div class="unit"><input class="inp" id="p_price" value="1580"><span class="u">萬</span></div></div>'+
    '<div><label class="fl">車位價 <i>拆單價用</i></label><div class="unit"><input class="inp" id="p_pkp" value="200"><span class="u">萬</span></div></div>'+
   '</div>'+
   '</div>',
  out:'<div id="p_out"></div>'+
      '<div class="disc">公設比計算方式在實務上有兩種：一為公設÷權狀總坪（含車位），一為公設÷（權狀總坪−車位坪）。本表採後者（不含車位），較貼近「住宅本身的公設比」。101 年 1 月 1 日以後請照的建物，雨遮、屋簷不得計入登記面積。</div>',
  run:function(){

    var price=v('p_price')*10000, pkp=v('p_pkp')*10000;
    var lvl = ratio<=PAR('pubRatioOk',28)?'g':(ratio<=PAR('pubRatioWarn',34)?'y':'r');

    var h='<div class="hero-num '+(lvl==='g'?'good':lvl==='y'?'accent':'bad')+'">'+

    h+='<div class="kv">'+
      kvRow('權狀總坪','', nf(all,2)+' 坪')+
      kvRow('車位登記坪','', nf(pk,2)+' 坪')+
      kvRow('公共設施坪','大廳、梯廳、走道、機電、公設空間', nf(pub,2)+' 坪')+

      kvRow('主建物 ㎡','', nf(main*PING,2)+' ㎡')+

        kvRow('不含車位單價','（總價 − 車位價 '+nf(pkp/10000,0)+' 萬）÷（權狀 − 車位坪）　← 比價要用這個', noPk>0 ? nf((price-pkp)/noPk/10000,2)+' 萬/坪' : '—')+
        kvRow('實坪單價','總價 ÷ 主建物坪　← 你真正住到的每坪成本', main>0?nf(price/main/10000,2)+' 萬/坪':'—','tot')+
        '</div><p class="hint">同一間房，三個單價可以差到快一倍。屋主報「權狀單價」，你比價要用「不含車位單價」，客戶感受到的是「實坪單價」。</p></div>';

      (lvl==='g'?'公設比合理':lvl==='y'?'偏高，要問清楚':'過高，要有交代')+'</div><p>'+
      (lvl==='g'?'不含車位公設比 '+nf(ratio,1)+'％，屬於正常區間。'
       :lvl==='y'?'不含車位公設比 '+nf(ratio,1)+'％，偏高。要問：多出來的公設用在哪？健身房、閱覽室、交誼廳你會用嗎？<b>不會用的公設，每個月還是要繳管理費養。</b>'
       :'不含車位公設比 '+nf(ratio,1)+'％，每買 3 坪就有 1 坪走不進去。要確認是不是把逃生梯廳、機電空間、大而無當的門廳全部灌進來——這種公設不但用不到，管理費還照收。')+
      '</p></div>';
    $('p_out').innerHTML=h;
  },
  after:function(){
    var lock=false;
    $('u_p').addEventListener('input',function(){ if(lock)return; lock=true; $('u_m').value=(v('u_p')*PING).toFixed(2); lock=false });
    $('u_m').addEventListener('input',function(){ if(lock)return; lock=true; $('u_p').value=(v('u_m')/PING).toFixed(2); lock=false });
  }
 }}

{
 id:'deed', g:'risk', name:'謄本紅旗檢查', pill:['p-bad','踩雷前最後一關'],
 desc:'標示部、所有權部、他項權利部逐項勾。勾完直接給風險等級跟「該問誰什麼」。',

 build:function(){

     $('d_clear').onclick=function(){ var cs=document.querySelectorAll('.dchk'); for(var i=0;i<cs.length;i++) cs[i].checked=false; window.__run() };

    '<textarea class="inp" id="r_list" rows="8" style="font-family:inherit">新北市板橋區文化路二段\n新北市新莊區中正路\n新北市土城區中央路三段\n新北市中和區景平路</textarea></div>'+
   '<div><label class="fl">終點 <i>可留空</i></label><input class="inp" id="r_to" value="" style="font-family:inherit"></div>'+
   '<div class="row-btn"><button class="btn" id="r_go">產生導航連結</button></div>'+
   '</div>',
  out:'<div id="r_out"></div>'+
      '<div class="disc">Google 地圖多點導航網址每條上限 10 站，超過會自動拆成第二條接續。此工具只組網址，不呼叫任何 API，也不儲存地址。含個人資料的拜訪名單請留在自己的裝置，不要放進共用雲端或群組。</div>',
  run:function(){
    var from=sv('r_from').trim(), to=sv('r_to').trim();
    var raw=sv('r_list').split('\n');
    var pts=[];
    for(var i=0;i<raw.length;i++){ var s=raw[i].trim(); if(s) pts.push(s) }
    if(!pts.length){ $('r_out').innerHTML='<div class="verdict y"><div class="lv">還沒有地址</div><p>左邊一行貼一個地址，按產生就好。</p></div>'; return }
    var all=[]; if(from) all.push(from);
    for(var j=0;j<pts.length;j++) all.push(pts[j]);
    if(to) all.push(to);

    var chunks=[], MAX=10;
    for(var k=0;k<all.length;k+= (MAX-1)){
      var c=all.slice(k, k+MAX);
      if(c.length>1) chunks.push(c);
    }
    var h='<div class="hero-num accent"><div class="lab">今日拜訪</div><div class="val">'+pts.length+' <small>站</small></div>'+
      '<div class="note">拆成 '+chunks.length+' 條導航連結 ‧ 手機點開直接導航</div></div>';
    h+='<div class="linklist">';
    for(var m=0;m<chunks.length;m++){
      var url='https://www.google.com/maps/dir/'+chunks[m].map(encodeURIComponent).join('/');
      h+='<a class="lk" href="'+url+'" target="_blank" rel="noopener noreferrer"><b>第 '+(m+1)+' 段導航（'+chunks[m].length+' 個點）</b>'+
         '<span>'+chunks[m].join(' → ')+'</span><span class="src">Google 地圖 ‧ 免金鑰</span></a>';
    }
    h+='</div>';
    h+='<div class="box" style="margin-top:12px"><h4>出門前</h4><div class="kv">'+
      kvRow('每個點都要有回填','拜訪完當場回填，回公司就忘了','必填')+
      kvRow('話題包先準備','到場前先看過該點的行情與周邊成交','建議')+
      kvRow('聯絡資料','只放自己裝置，不進群組、不上共用雲端','個資紅線')+
      '</div></div>';
    $('r_out').innerHTML=h;
  },
  after:function(){ $('r_go').onclick=function(){ window.__run() } }
 }}
},

{
 id:'match', g:'buyer', name:'買方需求匹配器', pill:['p-acc','招牌'],
 desc:'591 只會篩總價、坪數、地區。這裡多問通勤、優先項目、為什麼要買，從你手上的物件裡挑出真正合的，其餘直接整理成需求單傳給你。',
 tail:'比591更懂買家要什麼',
 sub:'填預算與生活需求，對你手上正在賣的物件逐一比對評分，順便產出一張可以直接傳的需求單',
 build:function(){

   ['near_mrt','近捷運／公車站'],['school','學區'],['parking','有車位'],['elevator','有電梯'],

  for(var ri=0;ri<lst.length;ri++){ if(lst[ri].region && regions.indexOf(lst[ri].region)<0) regions.push(lst[ri].region); }
  var regionH='';
  for(var rj=0;rj<regions.length;rj++){
    regionH+='<label class="chk"><input type="checkbox" class="m_region" value="'+regions[rj]+'"><span>'+regions[rj]+'</span></label>';
  }
  return {
  form:
   '<div class="f">'+
   '<div class="f2">'+
    '<div><label class="fl">你的稱呼 <i>選填，只是幫阿宏認人</i></label><input class="inp" id="m_name" value="" placeholder="例如：陳先生"></div>'+
    '<div><label class="fl">聯絡電話 <i>選填</i></label><input class="inp" id="m_phone" value="" placeholder="方便阿宏回電"></div>'+
   '</div>'+
   '<div class="f2">'+
    '<div><label class="fl">預算下限</label><div class="unit"><input class="inp" id="m_pmin" value="900"><span class="u">萬</span></div></div>'+
    '<div><label class="fl">預算上限</label><div class="unit"><input class="inp" id="m_pmax" value="1500"><span class="u">萬</span></div></div>'+
   '</div>'+
   '<div><label class="fl">房型需求</label>'+seg('m_rooms',[['1','1房'],['2','2房'],['3','3房'],['4','4房+']],'2')+'</div>'+
   (regionH? '<div><label class="fl">地區　<i>不勾＝不限，複選</i></label>'+regionH+'</div>' : '')+
   '<div><label class="fl">樓層偏好</label>'+seg('m_floor',[['any','不限'],['noground','不要一樓'],['elev','要有電梯'],['high','高樓層佳'],['top','頂樓可接受']],'any')+'</div>'+
   '<div><label class="fl">學區／商圈／捷運站／建案名 <i>選填，想指定就打關鍵字，可打好幾個用頓號分開</i></label>'+
    '<input class="inp" id="m_kw" value="" placeholder="例如：文化國小、裕民街商圈、板橋車站、亞洲大學"></div>'+
   '<div><label class="fl">通勤／生活重心地址 <i>選填，不會送出，只用來開地圖比對距離</i></label>'+
    '<input class="inp" id="m_work" value="" placeholder="例如：台北車站、板橋區公所"></div>'+
   '<div><label class="fl">在意的事　<i>複選，愈勾愈準</i></label>'+chkH+'</div>'+
   '<div><label class="fl">多久內想搬進去</label>'+seg('m_urgency',[['slow','不急，先看看'],['half','半年內想定案'],['rush','急，現在就要']],'half')+
    '<p class="hint" style="margin-top:6px">這欄不影響物件比對分數，但阿宏看需求單時會先處理標「急」的——沒時間窗的需求容易被排到後面。</p></div>'+
   '<div><label class="fl">如果一直找不到合適的房子，會怎樣 <i>用你自己的話說，這是最關鍵的一題</i></label>'+
    '<textarea class="inp" id="m_note" rows="3" placeholder="例如：租約到期要搬、小孩要上學卡學區、跟房東處不好、家裡多了人不夠住"></textarea></div>'+
   '<div class="row-btn"><button class="btn" id="m_go">找出合適物件</button></div>'+
   '</div>',
  out:'<div id="m_out"></div>'+
      '<div class="disc">比對用的物件資料由後台維護，只會是目前確實在銷售中的委託案，不吃 591 或任何平台資料。分數只是排序參考，不是保證交易條件；價格、屋況、坪數一律以謄本與現場為準。姓名電話留不留都可以，這頁不會存、不會送出，只是幫你把想講的話一次整理好，複製鍵按下去才會離開你的手機。</div>',
  run:function(){
    var pmin=v('m_pmin'), pmax=v('m_pmax')||999999, rooms=segv('m_rooms');
    var work=sv('m_work').trim(), note=sv('m_note').trim(), urgency=segv('m_urgency');
    var floorPref=segv('m_floor');
    var floorLab={any:'不限',noground:'不要一樓',elev:'要有電梯',high:'高樓層佳',top:'頂樓可接受'};
    var urgLab={slow:'不急，先看看',half:'半年內想定案',rush:'急，現在就要'};
    var checked=$('pBody').querySelectorAll('.m_tag:checked');
    var pri=[]; for(var i=0;i<checked.length;i++) pri.push(checked[i].value);
    var regionChecked=$('pBody').querySelectorAll('.m_region:checked');
    var wantRegions=[]; for(var ri2=0;ri2<regionChecked.length;ri2++) wantRegions.push(regionChecked[ri2].value);
    var kwRaw=sv('m_kw').trim();
    var kws=kwRaw? kwRaw.split(/[、,，\s]+/).filter(function(x){return x}) : [];
    var listings=(CFG.listings||[]);

    function scoreOf(L){
      var price=parseFloat(L.price)||0;
      if(price<=0) return null;
      if(price>pmax*1.15) return null;
      if(wantRegions.length && wantRegions.indexOf(L.region)<0) return null;
      var s=0, reasons=[];
      if(price>=pmin && price<=pmax){ s+=3; reasons.push('落在預算內'); }
      else if(price<=pmax*1.15){ s+=1; reasons.push('超預算 '+nf(price-pmax,0)+' 萬，但在可談範圍'); }
      else { s-=1; reasons.push('低於預算下限，總價相對親民'); }
      if(rooms && L.rooms===rooms){ s+=2; reasons.push(L.rooms+'房，符合房型需求'); }
      var mt=[];
      for(var j=0;j<pri.length;j++){ if(L.tags && L.tags.indexOf(pri[j])>=0){ s+=1; mt.push(tagLab[pri[j]]||pri[j]); } }
      if(mt.length) reasons.push('符合在意的事：'+mt.join('、'));

      /* 樓層偏好：只吃後台填的 floor 文字與 tags.elevator，判不出來就不加不扣，交給人工判斷 */
      var floorTxt=String(L.floor||'');
      var hasElev=L.tags && L.tags.indexOf('elevator')>=0;
      var floorNum=parseInt(floorTxt,10);
      if(floorPref==='noground'){
        if(/1樓|一樓/.test(floorTxt)){ s-=3; reasons.push('是一樓，跟需求不符'); }
        else if(floorTxt){ s+=1; reasons.push('非一樓'); }
      } else if(floorPref==='elev'){
        if(hasElev){ s+=2; reasons.push('有電梯'); }
        else if(L.tags){ s-=1; reasons.push('未標示有電梯，要再確認'); }
      } else if(floorPref==='high'){
        if(!isNaN(floorNum) && floorNum>=6){ s+=1; reasons.push(floorTxt+'，樓層夠高'); }
      } else if(floorPref==='top'){
        if(/頂樓/.test(floorTxt)){ s+=2; reasons.push('頂樓'); }
      }

      /* 地緣關鍵字：學區／商圈／捷運站／建案名／交通，掃描後台填的相關欄位，命中就加分並講出命中哪個字 */
      if(kws.length){
        var haystack=[L.name,L.region,L.floor,L.note,L.schoolDistrict,L.nearbyBiz,L.jobHubs,L.transit].filter(Boolean).join(' ‧ ');
        var hitKw=[];
        for(var kwi=0;kwi<kws.length;kwi++){ if(haystack.indexOf(kws[kwi])>=0) hitKw.push(kws[kwi]); }
        if(hitKw.length){ s+=hitKw.length*2; reasons.push('命中關鍵字：'+hitKw.join('、')); }
      }

      return {L:L, score:s, reasons:reasons, matched:mt.length};
    }

    var scored=[];
    for(var k=0;k<listings.length;k++){ var r=scoreOf(listings[k]); if(r) scored.push(r); }
    scored.sort(function(a,b){ return b.score-a.score });

    var h='';
    if(!listings.length){
      h+='<div class="verdict y"><div class="lv">目前後台還沒建物件資料</div>'+
        '<p>買方需求匹配器要比對的是「阿宏手上正在賣的物件」，不是市場全部物件。後台還沒建物件清單前，這裡只能先幫你把需求整理成一張單子，直接複製傳給阿宏，由他從現有委託裡幫你挑。</p></div>';
    } else {
      var top=scored.filter(function(r){return r.score>0});
      h+='<div class="hero-num accent"><div class="lab">符合條件的物件</div>'+
        '<div class="val">'+top.length+' <small>／ '+listings.length+' 件在售</small></div>'+
        '<div class="note">依預算、房型、在意的事排序，分數愈高愈合</div></div>';
      if(!top.length){
        h+='<div class="verdict y"><div class="lv">目前沒有完全吻合的物件</div><p>手上物件跟這組需求對不上，別勉強湊——把需求傳給阿宏，等新委託進來或去談降價空間。</p></div>';
      } else {
        h+='<div class="linklist">';
        for(var m=0;m<Math.min(top.length,8);m++){
          var r2=top[m], L=r2.L;
          var mapUrl = work ? 'https://www.google.com/maps/dir/'+encodeURIComponent(work)+'/'+encodeURIComponent((L.region||'')+(L.name||'')) : '';
          h+='<a class="lk" '+(mapUrl?'href="'+mapUrl+'" target="_blank" rel="noopener noreferrer"':'href="javascript:void(0)"')+'>'+
             '<b>'+(L.name||'未命名物件')+'　'+nf(parseFloat(L.price)||0,0)+' 萬</b>'+
             '<span>'+(L.region||'')+(L.rooms?'　'+L.rooms+'房':'')+(L.floor?'　'+L.floor:'')+'</span>'+
             '<span>'+r2.reasons.join('　‧　')+'</span>'+
             (work?'<span class="src">點開＝從「'+work+'」到此案的路線</span>':'')+
             '</a>';
        }
        h+='</div>';
        if(top.length>8) h+='<p class="hint">還有 '+(top.length-8)+' 件分數較低但仍在預算內，完整清單直接問阿宏。</p>';
      }
    }

    var name=sv('m_name').trim(), phone=sv('m_phone').trim();
    var matchedNames=scored.filter(function(r){return r.score>0}).map(function(r){return r.L.name}).join('、');

    var needText='【買方需求單】\n'+
      '急迫度　'+(urgLab[urgency]||urgency)+'\n'+
      (name?'稱呼　'+name+'\n':'')+(phone?'電話　'+phone+'\n':'')+
      '預算　'+nf(pmin,0)+' ～ '+nf(pmax,0)+' 萬\n房型　'+rooms+'房\n'+
      (wantRegions.length?'地區　'+wantRegions.join('、')+'\n':'')+
      (floorPref!=='any'?'樓層偏好　'+(floorLab[floorPref]||floorPref)+'\n':'')+
      (kws.length?'學區／商圈／建案關鍵字　'+kws.join('、')+'\n':'')+
      (work?'通勤／生活重心　'+work+'\n':'')+
      (pri.length?'在意的事　'+pri.map(function(x){return tagLab[x]||x}).join('、')+'\n':'')+
      (note?'如果找不到會怎樣　'+note+'\n':'')+
      (listings.length? '\n系統比對結果　'+scored.filter(function(r){return r.score>0}).length+' 件符合'+(matchedNames?'（'+matchedNames+'）':'') : '')+
      '\n※ 這是買方自填需求，不是物件事實，物件詳情以阿宏確認為準';
    window.__matchSummary=needText;

    /* 對應「買方回報表」欄位：日期／買方姓名／電話／有無實際約看／接觸來源／問物件／互動狀況
       Tab 分隔，貼進 Excel 會自動落成一列，各自對到一欄 */
    var today=new Date(); function p2(n){return n<10?'0'+n:''+n}
    var dateStr=today.getFullYear()+'/'+p2(today.getMonth()+1)+'/'+p2(today.getDate());
    var rowText=[dateStr, name||'', phone||'', '', '工具站-買方需求匹配器', matchedNames||'（無匹配，見需求單）', ''].join('\t');
    window.__matchRow=rowText;

    h+='<div class="row-btn" style="margin-top:12px">'+
       '<button class="btn sm ghost" id="m_copy">複製需求單給阿宏</button>'+
       (INTERNAL?'<button class="btn sm ghost" id="m_copyRow">複製一列給買方回報表.xlsx</button>':'')+
       '</div>'+
       (INTERNAL?'<p class="hint">內部工具：複製後直接貼進「買方回報表」空白列最左欄，會自動分成日期／姓名／電話／接觸來源／問物件幾欄，「有無實際約看」跟「互動狀況」空著，帶看後手動補。</p>':'');
    $('m_out').innerHTML=h;
    var btn=document.getElementById('m_copy');
    if(btn) btn.onclick=function(){ copy(window.__matchSummary||'','需求單已複製，可直接貼 LINE') };
    var btnRow=document.getElementById('m_copyRow');
    if(btnRow) btnRow.onclick=function(){ copy(window.__matchRow||'','已複製，貼進買方回報表空白列即可') };
  },
  after:function(){ $('m_go').onclick=function(){ window.__run() } }
 }}
}

/* ===================== 前台／後台：可見性 ===================== */
function visOf(id){ return CFG.tools[id]||'public' }
var INTERNAL=!!window.__showInternal;
try{ if(localStorage.getItem('ah-internal')==='1') INTERNAL=true }catch(e){}
function shownTools(){
  return TOOLS.filter(function(t){
    var v=visOf(t.id);
    if(v==='off') return false;
    if(v==='private') return INTERNAL;
    return true;
  });
}

/* ===================== 品牌套用 ===================== */
function applyBrand(){
  var b=CFG.brand;
  document.title=b.site;
  $('bMark').textContent=b.mark;
  $('bSite').textContent=b.site;
  $('bSlogan').textContent=b.slogan;
  $('bFree').textContent=b.freeTag;
  $('bFree').style.display= b.freeTag? '':'none';
  $('hTitle').textContent=CFG.hero.title;
  $('hSub').textContent=CFG.hero.sub;
  var contact=[];
  if(b.name) contact.push(b.name+(b.title?'　'+b.title:''));
  if(b.store) contact.push(b.store);
  if(b.phone) contact.push(b.phone);
  if(b.area) contact.push(b.area);
  var lic=[];
  if(b.company) lic.push(b.company);
  if(b.licenseBroker) lic.push('經紀人 林秀嫻 '+b.licenseBroker);
  if(b.licenseSales) lic.push('經紀營業員 何志宏 '+b.licenseSales);
  $('foot').innerHTML=
    '<b>'+b.site+'</b>'+(contact.length?'　'+contact.join('　‧　'):'')+'<br>'+
    (lic.length? lic.join('　‧　')+'<br>' : '')+
    CFG.legal.footer+'<br>'+CFG.legal.privacy+
    '<div class="foot-tools">'+
      '<button id="fInt">'+(INTERNAL?'關閉內部工具（回到客戶看到的畫面）':'顯示內部工具')+'</button>'+
    '</div>';
  $('fInt').onclick=function(){
    INTERNAL=!INTERNAL;
    try{ localStorage.setItem('ah-internal', INTERNAL?'1':'0') }catch(e){}
    applyBrand(); renderHome(); toast(INTERNAL?'已顯示內部工具':'已切回客戶畫面');
  };
  if(PREVIEW && !document.getElementById('pvbar')){
    var d=document.createElement('div');
    d.id='pvbar'; d.className='pvbar';
    d.textContent='後台預覽模式　這是套用草稿設定後的前台畫面，尚未發布';
    document.body.insertBefore(d, document.body.firstChild);
  }
}

/* ===================== 前台 CTA ===================== */
function ctaHTML(){
  var c=CFG.lead, b=CFG.brand;
  if(!c.on) return '';
  var href='', label=c.label;
  if(c.action==='line' && b.lineUrl) href=b.lineUrl;
  else if(c.action==='phone' && b.phone) href='tel:'+b.phone.replace(/[^0-9+]/g,'');
  if(!href && c.action!=='none') return '';
  if(c.action==='none') {
    return '<div class="cta"><div class="t"><b>'+label+'</b><span>'+c.text+'</span></div></div>';
  }
  return '<div class="cta"><div class="t"><b>'+label+'</b><span>'+c.text+'</span></div>'+
         '<a class="go" href="'+href+'" target="_blank" rel="noopener noreferrer">'+
         (c.action==='phone'?'撥給 '+(b.name||'我'):'加 LINE 問')+'</a></div>';
}

/* ===================== 渲染 ===================== */
var filter='all';
function renderHome(){
  var pool=shownTools();
  var rail='<button class="chip" data-f="all" aria-pressed="'+(filter==='all')+'">全部工具 '+pool.length+'</button>';
  for(var i=0;i<GROUPS.length;i++){
    var gid=GROUPS[i].id;
    var c=pool.filter(function(t){return t.g===gid}).length;
    if(!c) continue;
    rail+='<button class="chip" data-f="'+gid+'" aria-pressed="'+(filter===gid)+'">'+GROUPS[i].name+' '+c+'</button>';
  }
  $('rail').innerHTML=rail;
  var chips=$('rail').querySelectorAll('.chip');
  for(var j=0;j<chips.length;j++){
    chips[j].onclick=function(){ filter=this.dataset.f; renderHome() };
  }
  var out='';
  if(INTERNAL){
    var nInt=TOOLS.filter(function(t){return visOf(t.id)==='private'}).length;
    out+='<div class="intbar"><b>內部工具已開啟</b>'+
         '有 '+nInt+' 支標示為「只有我看得到」的工具正顯示在下面。客戶用你發布出去的網址進來時看不到它們。'+
         '這是入口隱藏，不是加密——真正含個資的東西不要放進任何網頁。</div>';
  }
  for(var g=0;g<GROUPS.length;g++){
    if(filter!=='all' && filter!==GROUPS[g].id) continue;
    var gid2=GROUPS[g].id;
    var list=pool.filter(function(t){return t.g===gid2});
    if(!list.length) continue;
    out+='<div class="group"><div class="group-h"><h2>'+GROUPS[g].name+'</h2><em>'+list.length+' 支</em></div>'+
         '<p class="group-note">'+GROUPS[g].note+'</p><div class="grid">';
    for(var k=0;k<list.length;k++){
      var t=list[k], priv=visOf(t.id)==='private';
      out+='<button class="card'+(priv?' internal':'')+'" data-id="'+t.id+'">'+
        '<div class="card-top"><h3>'+t.name+'</h3>'+
        (priv?'<span class="pill p-int">內部</span>':'<span class="pill '+t.pill[0]+'">'+t.pill[1]+'</span>')+'</div>'+
        '<p>'+t.desc+'</p>'+
        '<div class="card-tail">'+t.tail+'</div></button>';
    }
    out+='</div></div>';
  }
  if(!pool.length) out='<div class="verdict y"><div class="lv">目前沒有上架的工具</div><p>到後台把工具設成「客戶看得到」再發布。</p></div>';
  $('groups').innerHTML=out;
  var cards=$('groups').querySelectorAll('.card');
  for(var m=0;m<cards.length;m++){
    cards[m].onclick=function(){ location.hash='#/'+this.dataset.id };
  }
}

/* 物件簡報頁帶入本案總價：/tools/?price=1398#/loan（單位：萬元） */
var CASE_PRICE_INPUT={loan:'l_price'};
function applyCasePrice(id){
  var m=location.search.match(/[?&]price=(\d+(?:\.\d+)?)/);
  if(!m) return;
  var el=$(CASE_PRICE_INPUT[id]||'');
  if(el) el.value=m[1];
}

function openTool(id){
  var t=null;
  for(var i=0;i<TOOLS.length;i++) if(TOOLS[i].id===id) t=TOOLS[i];
  if(!t){ location.hash=''; return }
  var vis=visOf(t.id);
  if(vis==='off' || (vis==='private' && !INTERNAL)){ location.hash=''; return }
  var cfg=t.build();
  $('pTitle').textContent=t.name;
  $('pSub').textContent=t.sub;
  $('pBody').innerHTML=
    '<div class="cols'+(cfg.wide?' wide':'')+'">'+
      '<div class="box'+(cfg.wide?'':' stick')+'" style="'+(cfg.wide?'border:0;background:transparent;padding:0':'')+'">'+
        (cfg.wide?'':'<h4>參數</h4>')+cfg.form+
      '</div>'+
      '<div>'+cfg.out+ (vis==='public'?ctaHTML():'') +'</div>'+
    '</div>';
  window.__run=cfg.run;
  autoRun($('pBody'));
  if(cfg.after) cfg.after();
  applyCasePrice(t.id);
  cfg.run();
  $('home').style.display='none';
  $('panel').classList.add('on');
  window.scrollTo(0,0);
}

function route(){
  var h=location.hash;
  if(h.indexOf('#/')===0){ openTool(h.slice(2)) }
  else{
    $('panel').classList.remove('on');
    $('home').style.display='';
    window.__run=null;
  }
}
window.addEventListener('hashchange',route);
$('backBtn').onclick=function(){ location.hash='' };

/* 主題 */
(function(){
  var saved=null;
  try{ saved=localStorage.getItem('ah-theme') }catch(e){}
  if(saved) document.documentElement.setAttribute('data-theme',saved);
  $('themeBtn').onclick=function(){
    var cur=document.documentElement.getAttribute('data-theme');
    if(!cur){ cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light' }
    var next = cur==='dark' ? 'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem('ah-theme',next) }catch(e){}
  };
})();

applyBrand();
renderHome();
route();
</script>
