<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阿宏在售物件｜雙北桃園嚴選委託</title>
<meta name="description" content="何志宏（阿宏）目前銷售中的委託物件：樹林、板橋、新莊、三峽、桃園。每一間的缺點先講完，開價≠成交價，留言碼私訊領完整資料。">
<meta property="og:title" content="阿宏在售物件｜雙北桃園嚴選委託">
<meta property="og:description" content="賣房不賣夢。每一間的缺點先講完，留言碼私訊領完整資料與看屋檢核表。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://0930848000.com/wujian/">
<meta property="og:image" content="https://0930848000.com/wujian/haojing/a/p_outside.jpg">
<link rel="canonical" href="https://0930848000.com/wujian/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --ground:#FFFFFF; --surface:#FFFFFF; --surface2:#F6F8F7; --raise:#FFFFFF;
  --line:#E4E7E4; --line2:#CDD3CE;
  --ink:#1C2320; --ink2:#4A534E; --ink3:#78807A;
  --accent:#1F5C46; --accent-soft:#EDF3F0; --accent-ink:#FFFFFF;
  --gold:#B8893B;
  --bad:#9C4A2F; --bad-soft:#F7ECE6;
  --good:#1F5C46; --good-soft:#EDF3F0;
  --pub:#2F6180; --pub-soft:#DBE8F0;
  --shadow:0 1px 2px rgba(28,35,32,.05), 0 10px 26px -16px rgba(28,35,32,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei UI","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
header.bar{position:sticky;top:0;z-index:40;background:var(--ground);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding:12px 0}
.mark{width:34px;height:34px;flex:none;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:17px;text-decoration:none}
.brand b{display:block;font-size:16px;font-weight:800;line-height:1.2}
.brand span{display:block;font-size:11.5px;color:var(--ink3);letter-spacing:.06em}
.bar-sp{flex:1}
.bar a.home{font-size:12.5px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--surface);white-space:nowrap}

.creed{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:4px;padding:14px 16px;margin:18px 0 4px}
.creed p{margin:0;font-size:15.5px;font-weight:700}
.creed small{display:block;margin-top:5px;color:var(--ink2);font-size:12.5px}

.rail{display:flex;gap:8px;overflow-x:auto;padding:14px 0 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.grid{display:grid;gap:14px;grid-template-columns:1fr;margin:6px 0 26px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:1fr 1fr 1fr}}

.lcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.lcard .ph{aspect-ratio:16/10;background:var(--surface2);overflow:hidden}
.lcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.lcard .ph.noimg{display:grid;place-items:center;color:var(--ink3);font-size:12.5px;letter-spacing:.1em}
.lbody{padding:13px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.lhead h2{margin:0;font-size:16px;font-weight:800;line-height:1.4}
.lhead .loc{font-size:12px;color:var(--ink3);letter-spacing:.04em;margin-top:2px}
.price{font-variant-numeric:tabular-nums}
.price b{font-size:21px;color:var(--gold);letter-spacing:.01em}
.price small{font-size:11.5px;color:var(--ink3);margin-left:6px}
.specs{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:11px;font-weight:700;padding:2.5px 8px;border-radius:3px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.warn{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.sell{margin:0;font-size:12.8px;color:var(--ink2);line-height:1.6}
.honest{margin:0;font-size:12.3px;color:var(--bad);line-height:1.55}
.honest::before{content:"缺點先講：";font-weight:700}
.cta{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.btn-line{flex:1;text-align:center;text-decoration:none;background:var(--good);color:#fff;font-weight:800;font-size:13.5px;padding:10px 8px;border-radius:6px}
.btn-line{background:#06C755}
.btn-code{flex:none;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;padding:10px 12px;border-radius:6px;cursor:pointer}
.btn-code.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}

.note{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:12px 14px;margin:4px 0 18px;font-size:12.5px;color:var(--ink2);line-height:1.7}
footer{border-top:1px solid var(--line);margin-top:10px;padding:20px 0 34px;font-size:12px;color:var(--ink3);line-height:1.8}
footer b{color:var(--ink2)}
.flinks{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.flinks a{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px}
</style>
</head>
<body>

<div id="ahnav"></div>

<main class="wrap">
  <div class="creed">
    <p>每一間的缺點，我先講完。</p>
    <small>開價≠成交價。這裡列的是目前確實在銷售中的委託案——想看完整資料（影片動線、誠實揭露清單、看屋檢核表），把留言碼傳到 LINE，我親自回。</small>
  </div>

  <div class="rail" id="rail" role="tablist"></div>
  <div class="grid" id="grid"></div>

  <div class="note">
    ‧ 所有總價為委託開價，開價≠成交價，成交以實際磋商為準　‧ 坪數、格局、屋齡依委託資料，一律以謄本與現場為準　‧ 距離皆為「約 X 公尺（距離依 Google 地圖）」不寫分鐘　‧ 完整地址與屋況細節不在公開頁揭露，私訊提供
  </div>

</main>
<div id="ahfoot"></div>

<script src="/site.config.js?v=20260818"></script>
<script src="/nav.js?v=20260818e"></script>
<script src="/wujian/data.js"></script>
<script>
var LINE='https://lin.ee/IV8bl9H';
var L=window.AHLISTINGS||[];

var REG=['全部','樹林','板橋','新莊','三峽','桃園'];
var cur='全部';
function nf(x){return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function render(){
  var rail=document.getElementById('rail');
  rail.innerHTML=REG.map(function(r){
    return '<button class="chip" role="tab" aria-pressed="'+(r===cur)+'" data-r="'+r+'">'+r+'</button>';
  }).join('');
  var g=document.getElementById('grid');
  g.innerHTML=L.filter(function(x){return cur==='全部'||x.r===cur}).map(function(x,i){
    var ph=x.img
      ?'<div class="ph"><img src="'+x.img+'" alt="'+x.n+' 實拍" loading="lazy"></div>'
      :'<div class="ph noimg">實拍照私訊提供</div>';
    return '<article class="lcard" id="'+(x.id||'')+'">'+ph+'<div class="lbody">'+
      '<div class="lhead"><h2>'+x.n+'</h2><div class="loc">'+x.loc+'</div></div>'+
      '<div class="price"><b>'+nf(x.p)+' 萬</b><small>'+x.pt+'・開價≠成交價</small></div>'+
      '<div class="specs">'+x.sp.map(function(s){return '<span class="pill">'+s+'</span>'}).join('')+'</div>'+
      '<p class="sell">'+x.sell+'</p>'+
      '<p class="honest">'+x.honest+'</p>'+
      '<div class="cta">'+
        '<a class="btn-line" href="'+LINE+'">LINE 傳「'+x.code+'」領完整資料</a>'+
        '<button class="btn-code" data-code="'+x.code+'">複製留言碼</button>'+
      '</div></div></article>';
  }).join('');
}
document.addEventListener('click',function(e){
  var c=e.target.closest('.chip'); if(c){cur=c.dataset.r;render();return}
  var b=e.target.closest('.btn-code'); if(b){
    var t=b.dataset.code, done=function(){b.textContent='已複製';b.classList.add('ok');setTimeout(function(){b.textContent='複製留言碼';b.classList.remove('ok')},1600)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallback(t,done)})}
    else fallback(t,done);
  }
});
function fallback(t,done){
  var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');done()}catch(e){window.prompt('長按複製留言碼：',t)}
  document.body.removeChild(ta);
}
render();
if(location.hash){
  var t=document.getElementById(location.hash.slice(1));
  if(t) t.scrollIntoView({block:'center'});
}
</script>
</body>
</html>
